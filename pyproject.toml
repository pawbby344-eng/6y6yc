[project]
name = "mp-parser"
version = "0.1.0"
description = "Парсер поиска Wildberries и Ozon с выдачей в Telegram"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.13,<4", "httpx>=0.27"]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["mp_parser*"]
